[project]
name = "energy-forecast-notebooks"
version = "0.1.0"
description = "Notebooks de exploracion y preparacion de datos para Energy Forecast App"
authors = [
    {name = "andyalv", email = "andy.red02@gmail.com"},
    {name = "98beto", email = "esbjavo@gmail.com"}
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas (>=2.2.0,<3.0.0)",
    "matplotlib (>=3.8.0,<4.0.0)",
    "pmdarima (>=2.1.1,<3.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "notebook (>=7.5.6,<8.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
