name: Build Desktop App

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "energy-forecast-app/**"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  UV_PYTHON: "3.12"
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"

jobs:
  build:
    name: Build ${{ matrix.name }} app
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            target: windows
          - name: Linux
            runner: ubuntu-latest
            target: linux

    defaults:
      run:
        working-directory: energy-forecast-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Export package metadata
        id: package_metadata
        shell: bash
        run: |
          uv run python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project = pyproject["project"]
          flet = pyproject["tool"]["flet"]
          package = pyproject["tool"]["energy_forecast"]["package"]

          artifact = package["artifact"]
          version = project["version"]
          values = {
              "APP_ARTIFACT": artifact,
              "APP_NAME": flet["product"],
              "APP_COMPANY": flet["company"],
              "APP_COPYRIGHT": flet["copyright"],
              "APP_DESCRIPTION": project["description"],
              "APP_VERSION": version,
              "APP_FILE_VERSION": f"{version}.0" if version.count(".") == 2 else version,
              "APP_ICON_ICO": package["icon_ico"],
              "APP_ICON_PNG": package["icon_png"],
              "APPIMAGE_PATH": f"build/{artifact}-linux.AppImage",
              "APPIMAGE_DESKTOP": f"{artifact}.desktop",
              "APPIMAGE_ICON": f"{artifact}.png",
              "APPIMAGE_CATEGORIES": package["linux_categories"],
          }

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key, value in values.items():
                  env.write(f"{key}={value}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key in ("APP_ARTIFACT", "APPIMAGE_PATH"):
                  output.write(f"{key}={values[key]}\n")
          PY

      - name: Install Python dependencies
        run: uv sync

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        shell: bash
        run: |
          sudo apt-get update --allow-releaseinfo-change
          LINUX_DEPS="$(uv run python -c 'from flet.utils.linux_deps import linux_dependencies; print(" ".join(linux_dependencies))')"
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
          sudo apt-get clean

      - name: Check Flet environment
        run: uv run flet doctor

      - name: Install Windows packaging tools
        if: matrix.target == 'windows'
        run: uv pip install pyinstaller

      - name: Stage Flet app assets
        shell: bash
        run: |
          mkdir -p src/assets
          cp assets/icon.png src/assets/icon.png
          cp assets/icon.ico src/assets/icon.ico

      - name: Build Windows standalone executable
        if: matrix.target == 'windows'
        run: >-
          uv run flet pack src/main.py
          --name "${{ env.APP_ARTIFACT }}-windows"
          --distpath build/windows
          --product-name "${{ env.APP_NAME }}"
          --file-description "${{ env.APP_DESCRIPTION }}"
          --product-version "${{ env.APP_VERSION }}"
          --file-version "${{ env.APP_FILE_VERSION }}"
          --company-name "${{ env.APP_COMPANY }}"
          --copyright "${{ env.APP_COPYRIGHT }}"
          --icon "${{ env.APP_ICON_ICO }}"
          --hidden-import certifi
          --hidden-import psutil
          --hidden-import ray._private.object_ref_generator
          -y

      - name: Build Linux app
        if: matrix.target == 'linux'
        run: >-
          uv run flet build linux -v --yes
          --cleanup-packages
          --cleanup-package-files "**/__pycache__" "**/*.pyc" "**/*.pyo" "**/*.pyi" "**/tests" "**/test"

      - name: Build Linux AppImage
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          app_dir="build/appimage/EnergyForecast.AppDir"
          mkdir -p "$app_dir/usr/bin"
          cp -R build/linux/. "$app_dir/usr/bin/"

          executable="$(find "$app_dir/usr/bin" -maxdepth 1 -type f -executable | head -n 1)"
          if [ -z "$executable" ]; then
            echo "No executable found in build/linux"
            exit 1
          fi

          executable_name="$(basename "$executable")"
          cat > "$app_dir/AppRun" <<EOF
          #!/usr/bin/env bash
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/usr/bin/$executable_name" "\$@"
          EOF
          chmod +x "$app_dir/AppRun"

          cat > "$app_dir/$APPIMAGE_DESKTOP" <<EOF
          [Desktop Entry]
          Type=Application
          Name=$APP_NAME
          Exec=$executable_name
          Icon=$APP_ARTIFACT
          Categories=$APPIMAGE_CATEGORIES
          EOF

          cp "$APP_ICON_PNG" "$app_dir/$APPIMAGE_ICON"

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O build/appimagetool.AppImage
          chmod +x build/appimagetool.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 build/appimagetool.AppImage "$app_dir" "$APPIMAGE_PATH"

      - name: Upload ${{ matrix.name }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package_metadata.outputs.APP_ARTIFACT }}-${{ matrix.target }}
          path: ${{ matrix.target == 'windows' && format('energy-forecast-app/build/windows/{0}-windows.exe', steps.package_metadata.outputs.APP_ARTIFACT) || format('energy-forecast-app/{0}', steps.package_metadata.outputs.APPIMAGE_PATH) }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.AppImage
