name: Build Desktop App

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "energy-forecast-app/**"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  UV_PYTHON: "3.12"
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"

jobs:
  build:
    name: Build ${{ matrix.name }} app
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            target: windows
            artifact_name: energy-forecast-windows
            artifact_path: energy-forecast-app/build/windows/*.exe
          - name: Linux
            runner: ubuntu-latest
            target: linux
            artifact_name: energy-forecast-linux
            artifact_path: energy-forecast-app/build/energy-forecast-linux.AppImage

    defaults:
      run:
        working-directory: energy-forecast-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        shell: bash
        run: |
          sudo apt-get update --allow-releaseinfo-change
          LINUX_DEPS="$(uv run python -c 'from flet.utils.linux_deps import linux_dependencies; print(" ".join(linux_dependencies))')"
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
          sudo apt-get clean

      - name: Check Flet environment
        run: uv run flet doctor

      - name: Build Windows standalone executable
        if: matrix.target == 'windows'
        run: >-
          uv run --with pyinstaller flet pack src/main.py
          --name energy-forecast-windows
          --distpath build/windows
          --product-name "Energy Forecast App"
          --file-description "Energy demand forecasting desktop app"
          --product-version "0.1.0"
          --file-version "0.1.0.0"
          --company-name "TecNM"
          --copyright "Copyright (C) 2026 TecNM"
          --hidden-import certifi
          -y

      - name: Build Linux app
        if: matrix.target == 'linux'
        run: uv run flet build linux -v --yes

      - name: Build Linux AppImage
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          app_dir="build/appimage/EnergyForecast.AppDir"
          mkdir -p "$app_dir/usr/bin"
          cp -R build/linux/. "$app_dir/usr/bin/"

          executable="$(find "$app_dir/usr/bin" -maxdepth 1 -type f -executable | head -n 1)"
          if [ -z "$executable" ]; then
            echo "No executable found in build/linux"
            exit 1
          fi

          executable_name="$(basename "$executable")"
          cat > "$app_dir/AppRun" <<EOF
          #!/usr/bin/env bash
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/usr/bin/$executable_name" "\$@"
          EOF
          chmod +x "$app_dir/AppRun"

          cat > "$app_dir/energy-forecast.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Energy Forecast App
          Exec=$executable_name
          Icon=energy-forecast
          Categories=Science;Education;
          EOF

          cat > "$app_dir/energy-forecast.svg" <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
            <rect width="256" height="256" rx="48" fill="#0F172A"/>
            <path d="M42 164h28l21-58 27 92 30-126 25 92h41" fill="none" stroke="#38BDF8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          EOF

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O build/appimagetool.AppImage
          chmod +x build/appimagetool.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 build/appimagetool.AppImage "$app_dir" build/energy-forecast-linux.AppImage

      - name: Upload ${{ matrix.name }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.AppImage
