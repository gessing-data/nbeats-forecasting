name: Build Desktop App

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "energy-forecast-app/**"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "2.2.1"
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"
  APPIMAGETOOL_VERSION: "1.9.1"
  APPIMAGETOOL_SHA256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.name }} app
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            target: windows
          - name: Linux
            runner: ubuntu-latest
            target: linux

    defaults:
      run:
        working-directory: energy-forecast-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: python -m pip install "poetry==${{ env.POETRY_VERSION }}"

      - name: Export package metadata
        id: package_metadata
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project = pyproject["project"]
          flet = pyproject["tool"]["flet"]
          package = pyproject["tool"]["energy_forecast"]["package"]
          urls = project.get("urls", {})

          artifact = package["artifact"]
          version = project["version"]
          linux_app_id = package["linux_app_id"]
          values = {
              "APP_ARTIFACT": artifact,
              "APP_ID": linux_app_id,
              "APP_NAME": flet["product"],
              "APP_COMPANY": flet["company"],
              "APP_COPYRIGHT": flet["copyright"],
              "APP_DESCRIPTION": project["description"],
              "APP_HOMEPAGE": urls["Homepage"],
              "APP_LICENSE": project["license"],
              "APP_VERSION": version,
              "APP_FILE_VERSION": f"{version}.0" if version.count(".") == 2 else version,
              "APP_ICON_ICO": package["icon_ico"],
              "APP_ICON_PNG": package["icon_png"],
              "APPIMAGE_PATH": f"build/{artifact}-linux.AppImage",
              "APPIMAGE_DESKTOP": f"{linux_app_id}.desktop",
              "APPIMAGE_ICON": f"{linux_app_id}.png",
              "APPIMAGE_METAINFO": f"{linux_app_id}.metainfo.xml",
              "APPIMAGE_CATEGORIES": package["linux_categories"],
              "APPSTREAM_DEVELOPER_ID": package["appstream_developer_id"],
              "APPSTREAM_DESCRIPTION": package["appstream_description"],
          }

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key, value in values.items():
                  env.write(f"{key}={value}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key in ("APP_ARTIFACT", "APPIMAGE_PATH"):
                  output.write(f"{key}={values[key]}\n")
          PY

      - name: Install Python dependencies
        run: poetry sync --no-interaction

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        shell: bash
        run: |
          sudo apt-get update --allow-releaseinfo-change
          LINUX_DEPS="$(poetry run python -c 'from flet.utils.linux_deps import linux_dependencies; print(" ".join(linux_dependencies))')"
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
          sudo apt-get clean

      - name: Check Flet environment
        run: poetry run flet doctor

      - name: Stage Flet app assets
        shell: bash
        run: |
          mkdir -p src/assets
          cp assets/icon.png src/assets/icon.png
          cp assets/icon.ico src/assets/icon.ico

      - name: Build Windows standalone executable
        if: matrix.target == 'windows'
        run: >-
          poetry run flet pack src/main.py
          --onedir
          --name "${{ env.APP_ARTIFACT }}-windows"
          --distpath build/windows
          --product-name "${{ env.APP_NAME }}"
          --file-description "${{ env.APP_DESCRIPTION }}"
          --product-version "${{ env.APP_VERSION }}"
          --file-version "${{ env.APP_FILE_VERSION }}"
          --company-name "${{ env.APP_COMPANY }}"
          --copyright "${{ env.APP_COPYRIGHT }}"
          --icon "${{ env.APP_ICON_ICO }}"
          --hidden-import certifi psutil
          --pyinstaller-build-args=--additional-hooks-dir=packaging/pyinstaller_hooks
          -y

      - name: Archive Windows app
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $bundle = "build/windows/$env:APP_ARTIFACT-windows"
          $archive = "build/$env:APP_ARTIFACT-windows-x64.zip"
          if (-not (Test-Path -LiteralPath $bundle)) {
            throw "Windows bundle not found: $bundle"
          }
          Compress-Archive -LiteralPath $bundle -DestinationPath $archive -Force

      - name: Smoke test Windows app bundle
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $exe = "build/windows/$env:APP_ARTIFACT-windows/$env:APP_ARTIFACT-windows.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Windows executable not found: $exe"
          }
          & $exe --packaging-smoke-test

      - name: Build Linux app
        if: matrix.target == 'linux'
        run: >-
          poetry run flet build linux -v --yes
          --cleanup-packages
          --cleanup-package-files "**/__pycache__" "**/*.pyc" "**/*.pyo" "**/*.pyi" "**/tests" "**/test"

      - name: Build Linux AppImage
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          app_dir="build/appimage/EnergyForecast.AppDir"
          mkdir -p "$app_dir/usr/bin"
          cp -R build/linux/. "$app_dir/usr/bin/"

          executable="$(find "$app_dir/usr/bin" -maxdepth 1 -type f -executable | head -n 1)"
          if [ -z "$executable" ]; then
            echo "No executable found in build/linux"
            exit 1
          fi

          executable_name="$(basename "$executable")"
          cat > "$app_dir/AppRun" <<EOF
          #!/usr/bin/env bash
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/usr/bin/$executable_name" "\$@"
          EOF
          chmod +x "$app_dir/AppRun"

          cat > "$app_dir/$APPIMAGE_DESKTOP" <<EOF
          [Desktop Entry]
          Type=Application
          Name=$APP_NAME
          Comment=$APP_DESCRIPTION
          Exec=$executable_name
          Icon=$APP_ID
          Categories=$APPIMAGE_CATEGORIES
          Terminal=false
          EOF

          install -Dm644 "$app_dir/$APPIMAGE_DESKTOP" "$app_dir/usr/share/applications/$APPIMAGE_DESKTOP"

          mkdir -p "$app_dir/usr/share/metainfo"
          cat > "$app_dir/usr/share/metainfo/$APPIMAGE_METAINFO" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>$APP_ID</id>
            <name>$APP_NAME</name>
            <summary>$APP_DESCRIPTION</summary>
            <description>
              <p>$APPSTREAM_DESCRIPTION</p>
            </description>
            <metadata_license>CC0-1.0</metadata_license>
            <project_license>$APP_LICENSE</project_license>
            <developer id="$APPSTREAM_DEVELOPER_ID">
              <name>$APP_COMPANY</name>
            </developer>
            <url type="homepage">$APP_HOMEPAGE</url>
            <launchable type="desktop-id">$APPIMAGE_DESKTOP</launchable>
            <content_rating type="oars-1.1" />
          </component>
          EOF

          cp "$APP_ICON_PNG" "$app_dir/$APPIMAGE_ICON"
          install -Dm644 "$APP_ICON_PNG" "$app_dir/usr/share/icons/hicolor/256x256/apps/$APPIMAGE_ICON"

          wget -q "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-x86_64.AppImage" -O build/appimagetool.AppImage
          echo "$APPIMAGETOOL_SHA256  build/appimagetool.AppImage" | sha256sum -c -
          chmod +x build/appimagetool.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 build/appimagetool.AppImage "$app_dir" "$APPIMAGE_PATH"

      - name: Generate artifact checksum
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ matrix.target }}" = "windows" ]; then
            artifact_path="build/$APP_ARTIFACT-windows-x64.zip"
          else
            artifact_path="$APPIMAGE_PATH"
          fi

          sha256sum "$artifact_path" > "$artifact_path.sha256"

      - name: Upload ${{ matrix.name }} artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.package_metadata.outputs.APP_ARTIFACT }}-${{ matrix.target }}
          path: |
            ${{ matrix.target == 'windows' && format('energy-forecast-app/build/{0}-windows-x64.zip', steps.package_metadata.outputs.APP_ARTIFACT) || format('energy-forecast-app/{0}', steps.package_metadata.outputs.APPIMAGE_PATH) }}
            ${{ matrix.target == 'windows' && format('energy-forecast-app/build/{0}-windows-x64.zip.sha256', steps.package_metadata.outputs.APP_ARTIFACT) || format('energy-forecast-app/{0}.sha256', steps.package_metadata.outputs.APPIMAGE_PATH) }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: |
            release-artifacts/**/*.zip
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.sha256
