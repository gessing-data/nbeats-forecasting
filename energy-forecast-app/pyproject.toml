[project]
name = "energy-forecast-desktop"
version = "0.1.0"
description = ""
authors = [
    {name = "andyalv",email = "andy.red02@gmail.com"},
    {name = "98beto", email = "esbjavo@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas (>=2.2.0,<3.0.0)",
    "numpy (>=1.26.0,<2.0.0)",
    "flet (>=0.85.1,<0.86.0)",
    "matplotlib (>=3.8.0,<4.0.0)",
    "pmdarima (>=2.1.1,<3.0.0)",
    "scikit-learn (>=1.4.0,<2.0.0)",
    "neuralforecast (>=3.1.2,<4.0.0)",
    "torch (>=2.2.0,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)"
]

[tool.poetry]
package-mode = true
packages = [
    { include = "energy_forecast", from = "src" }
]
