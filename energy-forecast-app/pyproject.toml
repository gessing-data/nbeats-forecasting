[project]
name = "energy-forecast-desktop"
version = "0.1.0"
description = "Energy demand forecasting desktop app"
authors = [
    {name = "andyalv",email = "andy.red02@gmail.com"},
    {name = "98beto", email = "esbjavo@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas (>=2.2.0,<3.0.0)",
    "numpy (>=1.26.0,<2.0.0)",
    "flet[desktop] (==0.85.2)",
    "neuralforecast (>=3.1.2,<4.0.0)",
    "torch (>=2.2.0,<3.0.0)",
    "flet-charts (==0.85.2)",
    "plotly (>=6.7.0,<7.0.0)",
    "certifi (>=2024.0.0)",
]

[project.scripts]
app = "energy_forecast.desktop.app:run_app"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = true
packages = [
    { include = "energy_forecast", from = "src" }
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<9.0.0"

[tool.flet]
org = "mx.tecnm"
product = "Energy Forecast App"
company = "TecNM"
copyright = "Copyright (C) 2026 TecNM"

[tool.flet.app]
path = "src"

[tool.energy_forecast.package]
artifact = "energy-forecast"
icon_png = "assets/icon.png"
icon_ico = "assets/icon.ico"
linux_categories = "Science;Education;"
